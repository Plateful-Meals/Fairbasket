# Fairbasket: prices from Google Shopping (DataForSEO) for Tesco, Sainsbury's, Asda, Morrisons, Waitrose and Iceland.
#
# Run it by hand: Actions tab > "Google Shopping prices" > Run workflow.
#   mode test = searches some ingredients and writes a report. It does NOT change prices.json. Costs a few cents.
#   mode live = searches the ingredients, updates prices.json and saves it to the website.
#
# Automatic runs (Monday and Thursday, about twice a week) only happen when you make a repository variable called
# AUTO_UPDATE_GOOGLE and set it to  on  (Settings > Secrets and variables > Actions > Variables).
# Until that variable exists, nothing runs by itself.
#
# Needs the repository secrets DATAFORSEO_LOGIN and DATAFORSEO_PASSWORD (the API login and API password
# from the API Access page on dataforseo.com, not your website password).
#
# IMPORTANT: this file only works at  .github/workflows/google-shopping-prices.yml  in your repository.

name: Google Shopping prices

on:
  schedule:
    - cron: '23 5 * * 1,4'
  workflow_dispatch:
    inputs:
      mode:
        description: 'test = report only, prices.json is not changed.  live = updates prices.json and the website.'
        type: choice
        options:
          - test
          - live
        default: test
      limit:
        description: 'Test runs only: how many ingredients to search (30 costs about 4 cents).'
        type: string
        default: '30'
      scope:
        description: 'Live runs only: all = every tracked ingredient (about 15 cents).  due = only those whose turn it is.'
        type: choice
        options:
          - all
          - due
        default: all

permissions:
  contents: write
  pages: write

# shares a queue with the Apify price job so the two never save prices.json at the same moment
concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  prices:
    if: github.event_name != 'schedule' || vars.AUTO_UPDATE_GOOGLE == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check the matching rules still fit the site
        run: python pipeline/update_prices.py --check-config

      - name: Fetch and match the prices
        env:
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          MODE: ${{ github.event.inputs.mode || 'live' }}
          LIMIT: ${{ github.event.inputs.limit || '30' }}
          SCOPE: ${{ github.event.inputs.scope || 'all' }}
        run: |
          python pipeline/google_shopping_prices.py --mode "$MODE" --limit "$LIMIT" --scope "$SCOPE"
          cat pipeline/google-shopping-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the report and the raw Google answers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-shopping-prices
          path: |
            pipeline/google-shopping-report.md
            pipeline/google-shopping-raw/
          if-no-files-found: ignore

      - name: Save the results (live runs only)
        if: success() && (github.event.inputs.mode || 'live') == 'live'
        run: |
          git config user.name "fairbasket-bot"
          git config user.email "fairbasket-bot@users.noreply.github.com"
          git add prices.json pipeline/google-shopping-report.md
          if git diff --cached --quiet; then
            echo "Nothing changed, nothing to save."
          else
            git commit -m "Update prices from Google Shopping ($(date -u +%F))"
            git pull --rebase
            git push
          fi

      - name: Ask GitHub Pages to rebuild the site
        if: success() && (github.event.inputs.mode || 'live') == 'live'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "/repos/${{ github.repository }}/pages/builds" || echo "Could not request a rebuild; Pages usually rebuilds by itself after the push."
